id: wechat-devtools
name: 微信开发者工具 (WeChat DevTools)
category: ide
vendor: Tencent
homepage: https://developers.weixin.qq.com/miniprogram/dev/devtools/download.html

# 1. 活跃保护机制
protection:
  process_names:
    - "wechatwebdevtools"
    - "wechatdevtools"
    - "微信开发者工具"
  lock_files:
    - ~/Library/Application Support/微信开发者工具/SingletonLock
    - ~/Library/Application Support/微信开发者工具/Default/SingletonLock

# 2. 安装状态检测
detection:
  app_bundle_id:
    - com.tencent.webplusdevtools
    - com.tencent.wechat.devtools
  app_paths:
    - /Applications/wechatwebdevtools.app
    - /Applications/微信开发者工具.app

# 3. 清理目标配置
targets:
  caches:
    - path: ~/Library/Application Support/微信开发者工具/*/Default/WeappSimulator
      description: "微信小程序模拟器运行时与设备皮肤缓存 (可安全重建)"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/微信开发者工具/*/Default/WeappCode
      description: "小程序本地编译产物与临时打包构建缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/微信开发者工具/*/Default/WeappVendor
      description: "小程序基础库与编译内核依赖缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/微信开发者工具/*/Default/Cache
      description: "NW.js 浏览器内核与调试器缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/微信开发者工具/*/Default/Code Cache
      description: "V8 编译字节码缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/微信开发者工具/*/Default/GPUCache
      description: "GPU 渲染缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Caches/com.tencent.webplusdevtools
      description: "macOS 系统级开发者工具缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Caches/微信开发者工具
      description: "微信开发者工具系统缓存目录"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

  credentials:
    - path: ~/Library/Application Support/微信开发者工具/*/Default/Cookies
      description: "微信扫码登录态与会话 Cookie 凭据"
      default_selected: false
      contains_secrets: true

  data_and_history:
    - path: ~/Library/Application Support/微信开发者工具
      description: "开发者工具工作区历史、项目列表与完整运行环境"
      default_selected: false

    - path: ~/Library/Saved Application State/com.tencent.webplusdevtools.savedState
      description: "应用窗口恢复状态"
      default_selected: true

  preferences:
    - path: ~/Library/Preferences/com.tencent.webplusdevtools.plist
      description: "微信开发者工具全局偏好设置"
      default_selected: true

safety:
  protect_git_repos: true
  protect_workspaces: true
  exclude_paths:
    - ~/WeChatProjects
    - ~/Documents
    - ~/Projects
