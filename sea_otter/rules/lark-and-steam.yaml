id: lark-and-steam
name: 飞书 (Lark/Feishu) & Steam 孤儿库
category: desktop-agent
vendor: ByteDance & Valve
homepage: https://www.feishu.cn

# 1. 活跃保护机制
protection:
  process_names:
    - "Lark"
    - "Feishu"
    - "steam_osx"
    - "Steam Helper"
  lock_files:
    - ~/Library/Application Support/LarkShell/SingletonLock
    - ~/Library/Application Support/Lark/SingletonLock
    - ~/Library/Application Support/Feishu/SingletonLock
    - ~/Library/Application Support/Steam/steam.pid

# 2. 安装状态检测
detection:
  app_bundle_id:
    - com.electron.lark
    - com.bytedance.feishu
    - com.valvesoftware.steam
  app_paths:
    - /Applications/Lark.app
    - /Applications/Feishu.app
    - /Applications/飞书.app
    - /Applications/Steam.app

# 3. 清理目标配置
targets:
  caches:
    - path: ~/Library/Caches/com.electron.lark
      description: "飞书 / Lark 系统级离线图片、文档与网络缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Caches/com.bytedance.feishu
      description: "飞书系统级渲染与更新包缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Caches/LarkShell
      description: "飞书 LarkShell WebView 离线包与资源缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/LarkShell/*/Cache
      description: "飞书离线历史网页与富媒体缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/LarkShell/*/Code Cache
      description: "飞书小程序与网页脚本 V8 缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/Steam/appcache
      description: "Steam 商店缓存与游戏元数据缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/Steam/depotcache
      description: "Steam 历史游戏增量清单缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/Steam/logs
      description: "Steam 客户端运行时诊断日志"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Application Support/Steam/steamapps/shadercache
      description: "Steam 着色器预编译缓存 (可按需重建)"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

    - path: ~/Library/Caches/com.valvesoftware.steam
      description: "Steam macOS 系统级网页与资源缓存"
      default_selected: true
      prunable: true
      risk_level: L1_SAFE

  data_and_history:
    - path: ~/Library/Application Support/LarkShell
      description: "飞书桌面端离线历史网页与完整运行时数据"
      default_selected: true

    - path: ~/Library/Application Support/Lark
      description: "Lark 桌面客户端残留数据目录"
      default_selected: true

    - path: ~/Library/Application Support/Feishu
      description: "飞书桌面客户端残留数据目录"
      default_selected: true

    - path: ~/Library/Application Support/Steam
      description: "Steam 运行库、更新器与孤儿残留数据"
      default_selected: false

  preferences:
    - path: ~/Library/Preferences/com.electron.lark.plist
      description: "飞书 / Lark 应用偏好设置"
      default_selected: true

    - path: ~/Library/Preferences/com.valvesoftware.steam.plist
      description: "Steam 应用偏好设置"
      default_selected: true

safety:
  protect_git_repos: true
  protect_workspaces: true
  exclude_paths:
    - ~/Library/Application Support/Steam/steamapps/common
    - ~/Library/Application Support/Steam/userdata
    - ~/Documents
